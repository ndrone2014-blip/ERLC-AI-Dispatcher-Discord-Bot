# Hive Dispatch | ERLC — web dashboard on Netlify. Guide: docs/NETLIFY.md
#
# Netlify serves the dashboard pages; the edge function in web/netlify/edge-functions/ forwards sign-in and
# data requests to the bot running on your PC (through a tunnel). Set these in Netlify → Site configuration →
# Environment variables:
#   HIVE_BOT_URL       your tunnel address, e.g. https://your-name.ngrok-free.app
#   HIVE_PROXY_SECRET  a long random value; put the same value in the bot's .env as DASHBOARD_PROXY_SECRET

[build]
  # Only the web/ folder is deployed (so Netlify doesn't try to install the bot's Python packages).
  base = "web"
  publish = "static"
  command = "echo 'No build step: the dashboard is plain HTML, CSS and JavaScript.'"
  edge_functions = "netlify/edge-functions"

# The pages reference /static/...; on Netlify the static folder is the site root.
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# result.html is a server-side template used by the bot, not a page.
[[redirects]]
  from = "/result.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com https://media.discordapp.net https://*.rbxcdn.com; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
